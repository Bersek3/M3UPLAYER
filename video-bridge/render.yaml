services:
  - type: web
    name: tnt-video-bridge
    runtime: docker
    plan: starter
    dockerfilePath: ./video-bridge/Dockerfile.multi
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MAX_SESSIONS
        value: "2"
      - key: ALLOWED_ORIGINS
        value: https://m3u-player-one.vercel.app,https://bersek3.github.io,https://appassets.androidplatform.net
