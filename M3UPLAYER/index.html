<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <title>Samsung Smart TV - M3U Live Player</title>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap:; media-src * blob: data: http: https:; connect-src * http: https: ws: wss:;">
    <link rel="stylesheet" href="css/style.css?v=4.0.3">
    <script src="hls.min.js"></script>
</head>
<body class="tv-body">

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div id="video-container" class="video-container">
        <video id="main-video" autoplay playsinline></video>
    </div>

    <!-- BUFFERING SPINNER -->
    <div id="player-buffering" class="player-buffering hidden">
        <div class="tv-spinner"></div>
        <span>Cargando señal...</span>
    </div>

    <!-- ERROR NOTIFICATION -->
    <div id="player-error" class="player-error hidden">
        <div class="error-badge">
            <span class="error-icon">⚠️</span>
            <span id="player-error-text">Canal no disponible temporalmente</span>
        </div>
    </div>

    <!-- MAIN SINGLE-SCREEN TV OVERLAY (MATCHING USER SCREENSHOT) -->
    <div id="tv-main-overlay" class="tv-main-overlay">
        <!-- Dark gradient vignette over left side for crystal clear text readability while menu is visible -->
        <div class="video-vignette-overlay"></div>

        <!-- TOP RIGHT: LIVE CHANNEL WATERMARK (LOGO ONLY) -->
        <div id="channel-watermark" class="channel-watermark">
            <img id="watermark-logo" src="" alt="" class="watermark-img hidden">
        </div>

        <!-- LEFT SIDE: VERTICAL CHANNEL NAVIGATOR & EPG CARDS ROW -->
        <div class="tv-live-interface">

            <!-- VERTICAL CHANNEL STRIP (1, 2, 3, 4, 5..., WITH ACTIVE PINK CARD) -->
            <div id="vertical-channels-bar" class="vertical-channels-bar">
                <div id="channels-scroll-list" class="channels-scroll-list">
                    <!-- Injected dynamically:
                    <div class="channel-nav-item">
                        <span class="ch-num">1</span>
                        <div class="ch-logo-wrap"><img ...></div>
                    </div>
                    ...
                    -->
                </div>
            </div>

        </div>

        <!-- BOTTOM RIGHT: REAL-TIME DIGITAL CLOCK -->
        <div class="bottom-brand-clock">
            <span id="tv-clock" class="tv-clock">12:17</span>
        </div>

    </div>

    <!-- SAMSUNG SMART TV NATIVE EXIT DIALOG -->
    <div id="tv-exit-dialog" class="tv-modal-backdrop hidden">
        <div class="tv-exit-card">
            <div class="exit-icon-wrap">
                <span class="exit-tv-icon">📺</span>
            </div>
            <h2 class="exit-title">¿Deseas salir de la aplicación?</h2>
            <p class="exit-desc">Presiona para volver a los canales de la televisión o continuar viendo tu señal.</p>
            
            <div class="exit-buttons-row">
                <button id="btn-exit-cancel" class="btn-tv-exit btn-cancel active" data-index="0">
                    <span>Continuar viendo</span>
                </button>
                <button id="btn-exit-confirm" class="btn-tv-exit btn-confirm" data-index="1">
                    <span>Salir de la App</span>
                </button>
            </div>
            <div class="exit-hints">
                <span>[◄ ►] Seleccionar</span>
                <span>[OK] Confirmar</span>
                <span>[ATRÁS] Volver</span>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="tv-toast hidden"></div>

    <script src="main.js?v=4.0.5"></script>
</body>
</html>
